server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward /api/* to the FastAPI container ("backend" service in docker-compose).
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    client_max_body_size 50m;   # allow larger PDF uploads
    proxy_read_timeout 120s;    # LLM answers can take a while
  }

  # React Router: send every other path to index.html.
  location / {
    try_files $uri /index.html;
  }
}
